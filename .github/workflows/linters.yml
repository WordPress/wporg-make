name: Static Analysis (Linting)

# This workflow is triggered on pushes to trunk, and any PRs.
on:
    push:
        branches: [ trunk ]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    js-css:
        name: Lint JS and CSS
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # The lint configs come from wporg-repo-tools. Checking out the locked commit skips a Composer install.
            - name: Find the locked wporg-repo-tools commit
              id: repo-tools
              run: echo "ref=$( jq -r '."packages-dev"[] | select( .name == "wporg/wporg-repo-tools" ) | .source.reference' composer.lock )" >> "$GITHUB_OUTPUT"

            - name: Checkout wporg-repo-tools
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: WordPress/wporg-repo-tools
                  ref: ${{ steps.repo-tools.outputs.ref }}
                  path: vendor/wporg/wporg-repo-tools
                  persist-credentials: false

            - name: Install NodeJS
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  package-manager-cache: false

            # Shared with tests.yml: keep the paths and key identical so both workflows hit the same entry.
            - name: Cache node_modules
              id: node-modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      node_modules
                      source/wp-content/themes/wporg-make-2024/node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles( '.nvmrc', 'package-lock.json' ) }}

            - name: Install dependencies
              if: steps.node-modules.outputs.cache-hit != 'true'
              run: npm ci --ignore-scripts --no-audit --no-fund

            - name: Set up configs
              run: TEXTDOMAIN=wporg bash vendor/wporg/wporg-repo-tools/bin/update-configs

            - name: Lint CSS
              run: npm run lint:css

            - name: Lint JS
              run: npm run lint:js

    php:
        name: Lint PHP
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
              with:
                  php-version: '8.4'
                  coverage: none
              env:
                  COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Shared with tests.yml: keep the paths and key identical so both workflows hit the same entry.
            - name: Cache Composer dependencies
              id: composer
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      vendor
                      source/wp-content/mu-plugins/pub
                      source/wp-content/mu-plugins/wporg-mu-plugins
                      source/wp-content/plugins
                      source/wp-content/themes/wporg-parent-2021
                  key: composer-${{ runner.os }}-${{ hashFiles( 'composer.json', 'composer.lock' ) }}

            # Three packages are checked out from meta.svn, so only a cache miss needs Subversion.
            # The wporg/* build branches are force-pushed, so a locked commit can disappear; update them when it has.
            - name: Install Composer dependencies
              if: steps.composer.outputs.cache-hit != 'true'
              run: |
                  command -v svn > /dev/null || sudo apt-get install -y -qq subversion > /dev/null
                  composer install --no-interaction --no-progress || composer update --no-interaction --no-progress 'wporg/*'

            - name: Set up configs
              run: TEXTDOMAIN=wporg composer exec update-configs

            - name: Lint PHP
              run: composer lint ./source/wp-content/themes/wporg-make-2024
